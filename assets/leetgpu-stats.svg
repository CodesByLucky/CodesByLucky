<g class="fade" style="animation-delay:0.15s"><circle cx="31" cy="83" r="4" fill="#38bdae"/><text x="43" y="88" class="l">Global Score:</text><text x="190" y="88" class="v">4,865</text></g>
<g class="fade" style="animation-delay:0.30s"><circle cx="31" cy="105" r="4" fill="#38bdae"/><text x="43" y="110" class="l">Problems Solved:</text><text x="190" y="110" class="v">36 / 143</text></g>
<g class="fade" style="animation-delay:0.45s"><circle cx="31" cy="127" r="4" fill="#38bdae"/><text x="43" y="132" class="l">Total Submissions:</text><text x="190" y="132" class="v">52</text></g>
<g class="fade" style="animation-delay:0.60s"><circle cx="31" cy="149" r="4" fill="#38bdae"/><text x="43" y="154" class="l">Success Rate:</text><text x="190" y="154" class="v">90.4%</text></g>
<g class="fade" style="animation-delay:0.75s"><circle cx="31" cy="171" r="4" fill="#38bdae"/><text x="43" y="176" class="l">Current Streak:</text><text x="190" y="176" class="v">0 days</text></g>
<g transform="rotate(-90 400 108)">
  <circle cx="400" cy="108" r="46" stroke="#2a2e42" stroke-width="8"/>
  <circle cx="400" cy="108" r="46" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"
