<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-label="Progress on LeetGPU">
<title>Progress on LeetGPU</title>
<style>
  .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #70a5fd; }
  .h { font: 600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c0caf5; }
  .l { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c0caf5; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
  .s { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #787c99; }
  .big { font: 800 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c0caf5; }
  .rank { font: 800 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #2dd4bf; }
  .fade { animation: fade .6s ease-in-out both; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1s ease-out both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .fade, .grow { animation: none; } }
</style>
<rect x="0.5" y="0.5" rx="6" width="494" height="194" fill="#1a1b27" stroke="#2a2e42"/>
<text x="25" y="35" class="t">Progress on LeetGPU</text>
<text x="25" y="62" class="h">Difficulty</text>
<g class="fade" style="animation-delay:0.00s"><text x="25" y="86" class="l">Easy</text><text x="215" y="86" text-anchor="end" class="s">19 / 20</text><rect x="25" y="93" width="190" height="8" rx="4" fill="#2a2e42"/><rect class="grow" style="animation-delay:0.00s" x="25" y="93" width="180.5" height="8" rx="4" fill="#4ade80"/></g>
<g class="fade" style="animation-delay:0.15s"><text x="25" y="120" class="l">Medium</text><text x="215" y="120" text-anchor="end" class="s">9 / 91</text><rect x="25" y="127" width="190" height="8" rx="4" fill="#2a2e42"/><rect class="grow" style="animation-delay:0.15s" x="25" y="127" width="18.8" height="8" rx="4" fill="#facc15"/></g>
<g class="fade" style="animation-delay:0.30s"><text x="25" y="154" class="l">Hard</text><text x="215" y="154" text-anchor="end" class="s">8 / 33</text><rect x="25" y="161" width="190" height="8" rx="4" fill="#2a2e42"/><rect class="grow" style="animation-delay:0.30s" x="25" y="161" width="46.1" height="8" rx="4" fill="#f87171"/></g>
<text x="265" y="62" class="h">Solved by Language</text>
<g class="fade" style="animation-delay:0.00s"><circle cx="270" cy="81" r="5" fill="#ee4c2c"/><text x="281" y="86" class="l">PyTorch</text><text x="470" y="86" text-anchor="end" class="v">36 <tspan class="s">(25%)</tspan></text></g>
<text x="265" y="148" class="h">GPU Usage</text>
<rect x="265" y="156" width="205" height="8" rx="4" fill="#2a2e42"/>
<rect class="grow" x="265.0" y="156" width="197.1" height="8" fill="#2dd4bf"/>
<rect class="grow" x="462.1" y="156" width="7.9" height="8" fill="#bf91f3"/>
<circle cx="269" cy="178" r="4" fill="#2dd4bf"/><text x="277" y="182" class="s">T4 96%</text>
<circle cx="333" cy="178" r="4" fill="#bf91f3"/><text x="341" y="182" class="s">A100-80GB 4%</text>
</svg>
